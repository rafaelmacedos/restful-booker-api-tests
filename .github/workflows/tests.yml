name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      http_log:
        description: Log every request and response
        type: boolean
        default: false

# Least privilege at the top: only the deploy job gets to write to Pages.
permissions:
  contents: read

# One run per branch. A new push supersedes whatever was still running for it.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  ALLURE_RESULTS_DIR: target/allure-results
  ALLURE_REPORT_DIR: target/allure-report

jobs:
  test:
    name: API tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write         # test summary check run
      pull-requests: write  # test summary comment on the PR
    env:
      # Secrets come first because that is where these live today, with repository variables
      # and a literal behind them. Only the credentials really need to be secret: GitHub masks
      # a secret's exact text everywhere in the log, so a HTTP_LOG of "false" turns every
      # "false" in the output into ***.
      BASE_URL: ${{ secrets.BASE_URL || vars.BASE_URL || 'https://restful-booker.herokuapp.com' }}
      AUTH_LOGIN: ${{ secrets.AUTH_LOGIN }}
      AUTH_PASSWORD: ${{ secrets.AUTH_PASSWORD }}
      # Every response is checked against this. Looser than the local 5000: a shared runner
      # talking to a free dyno is slower than a laptop, and a timing flake fails a test that
      # is not about timing.
      MAX_RESPONSE_TIME_MS: ${{ secrets.MAX_RESPONSE_TIME_MS || vars.MAX_RESPONSE_TIME_MS || '10000' }}
      # Full request/response dump, for a run started by hand to debug a failure.
      HTTP_LOG: ${{ inputs.http_log || secrets.HTTP_LOG || vars.HTTP_LOG || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # The public restful-booker dyno sleeps. BaseTest aborts every class when /ping is
      # not 201, so a cold start would look like a suite-wide failure. Wake it up first.
      - name: Wake the API up
        run: |
          for attempt in $(seq 1 10); do
            status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$BASE_URL/ping" || true)
            echo "attempt $attempt: GET $BASE_URL/ping -> $status"
            if [ "$status" = "201" ]; then exit 0; fi
            sleep 15
          done
          echo "::warning::API never answered 201 on /ping - running anyway so the report shows why"

      # Trends, retries and duration history come from the previous report, not from this run.
      # Only main writes the cache, so PR runs read the trend without polluting it.
      - name: Restore Allure history
        uses: actions/cache/restore@v4
        with:
          path: allure-history
          key: allure-history-${{ github.run_id }}
          restore-keys: allure-history-

      - name: Run tests
        id: tests
        continue-on-error: true
        run: mvn -B -ntp test

      - name: Add Allure metadata
        if: always()
        run: ./scripts/allure-metadata.sh
        env:
          ALLURE_REPORT_URL: ${{ vars.ALLURE_REPORT_URL }}

      - name: Seed report history
        if: always()
        run: |
          if [ -d allure-history ]; then
            mkdir -p "$ALLURE_RESULTS_DIR"
            cp -r allure-history "$ALLURE_RESULTS_DIR/history"
          fi

      - name: Generate Allure report
        if: always()
        run: mvn -B -ntp allure:report

      - name: Collect history for the next run
        if: always()
        run: |
          rm -rf allure-history
          if [ -d "$ALLURE_REPORT_DIR/history" ]; then
            cp -r "$ALLURE_REPORT_DIR/history" allure-history
          fi

      - name: Save Allure history
        if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: allure-history
          key: allure-history-${{ github.run_id }}

      - name: Upload Allure report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: ${{ env.ALLURE_REPORT_DIR }}
          if-no-files-found: error
          retention-days: 14

      # Puts the failing test names in the PR itself, so nobody has to download an artifact
      # to find out what broke. Forks get a read-only token, hence continue-on-error.
      - name: Publish test summary
        if: always()
        continue-on-error: true
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: target/surefire-reports/TEST-*.xml
          check_name: API tests summary
          detailed_summary: true
          include_passed: false
          comment: ${{ github.event_name == 'pull_request' }}

      - name: Fail if any test failed
        if: steps.tests.outcome == 'failure'
        run: exit 1

  deploy:
    name: Publish report to Pages
    needs: test
    # Runs even when the suite is red - a failing report is exactly what you want published.
    if: >-
      !cancelled() &&
      needs.test.result != 'cancelled' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # GitHub Pages allows one deployment at a time and cancelling one mid-flight can leave
    # the site broken, so this group never cancels in progress.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download Allure report artifact
        uses: actions/download-artifact@v4
        with:
          name: allure-report
          path: allure-report

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      - id: deployment
        uses: actions/deploy-pages@v4
